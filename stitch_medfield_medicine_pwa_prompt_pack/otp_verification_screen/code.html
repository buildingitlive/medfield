<style>

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Header (Back Action) -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-lg flex items-center justify-between z-10 relative">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Optional Help Action -->
<button aria-label="Help" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile md:px-margin-desktop flex flex-col pt-md pb-xl">
<!-- Headers -->
<div class="mb-xl">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-sm">Verify your number</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the 6-digit clinical security code sent to 
                <span class="font-bold text-on-surface block mt-1">+1 (555) 867-5309</span>
</p>
</div>
<!-- OTP Form -->
<form class="flex flex-col flex-1" id="otp-form">
<!-- Boxed Inputs Container -->
<div class="flex justify-between gap-2 md:gap-sm mb-lg" id="otp-container">
<input aria-label="Digit 1" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
<input aria-label="Digit 2" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
<input aria-label="Digit 3" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
<input aria-label="Digit 4" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
<input aria-label="Digit 5" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
<input aria-label="Digit 6" class="w-12 h-16 md:w-14 md:h-16 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-[2px] focus:border-primary-container focus:ring-0 transition-all shadow-sm" maxlength="1" type="number"/>
</div>
<!-- Resend Timer -->
<div class="text-center mb-auto pt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-1">
                    Didn't receive code? 
                    <button class="font-label-md text-label-md text-outline disabled:opacity-50 transition-colors ml-1" disabled="" id="resend-btn" type="button">
                        Resend in <span id="timer-display">00:59</span>
</button>
</p>
</div>
<!-- Primary Action Button -->
<div class="mt-xl pt-lg">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-[0.98] transition-all shadow-sm disabled:opacity-50 disabled:active:scale-100" type="button">
                    Verify &amp; Continue
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- UI Logic Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            
            // Focus first input
            if(inputs.length > 0) {
                inputs[0].focus();
            }

            inputs.forEach((input, index) => {
                // Auto-advance logic
                input.addEventListener('input', (e) => {
                    // Ensure only one digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            input.blur(); // Dismiss keyboard on last input
                        }
                    }
                });

                // Backspace logic
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });

                // Prevent non-numeric paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, inputs.length);
                    
                    pastedData.split('').forEach((char, i) => {
                        if (index + i < inputs.length) {
                            inputs[index + i].value = char;
                            if (index + i === inputs.length - 1) {
                                inputs[index + i].focus();
                            } else {
                                inputs[index + i + 1].focus();
                            }
                        }
                    });
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const timerDisplay = document.getElementById('timer-display');
            const resendBtn = document.getElementById('resend-btn');

            const countdown = setInterval(() => {
                timeLeft--;
                let seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerDisplay.textContent = `00:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('text-outline');
                    resendBtn.classList.add('text-primary', 'hover:text-surface-tint');
                    resendBtn.innerHTML = 'Resend Code';
                }
            }, 1000);
        });
    </script>
</body></html>
