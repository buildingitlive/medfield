<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Create your account - MedField</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#006634",
                        "on-surface": "#181d18",
                        "surface-container-high": "#e5e9e2",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f1f5ed",
                        "on-surface-variant": "#3f4940",
                        "secondary-container": "#d2e8d5",
                        "outline": "#6f7a6f",
                        "surface-container-highest": "#dfe4dc",
                        "tertiary-fixed-dim": "#ffb2b8",
                        "on-primary-fixed": "#00210d",
                        "on-error": "#ffffff",
                        "on-primary-container": "#8ce1a2",
                        "inverse-surface": "#2d322d",
                        "on-tertiary-fixed-variant": "#7c2b36",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-fixed": "#40000e",
                        "surface-container": "#ebefe8",
                        "on-secondary-fixed-variant": "#384b3d",
                        "inverse-on-surface": "#eef2eb",
                        "outline-variant": "#bfc9bd",
                        "surface-bright": "#f6fbf3",
                        "on-tertiary-container": "#ffbfc3",
                        "primary": "#004c25",
                        "primary-fixed-dim": "#84d99a",
                        "primary-fixed": "#9ff5b5",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b6ccba",
                        "secondary": "#506354",
                        "surface": "#f6fbf3",
                        "on-error-container": "#93000a",
                        "on-background": "#181d18",
                        "on-secondary-container": "#55695a",
                        "tertiary": "#742531",
                        "surface-dim": "#d7dbd4",
                        "background": "#f6fbf3",
                        "tertiary-container": "#923c47",
                        "secondary-fixed": "#d2e8d5",
                        "surface-tint": "#0f6d3a",
                        "surface-variant": "#dfe4dc",
                        "inverse-primary": "#84d99a",
                        "on-primary-fixed-variant": "#005229",
                        "on-secondary-fixed": "#0d1f14",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "margin-desktop": "32px",
                        "xl": "48px",
                        "xs": "4px",
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Manrope"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Manrope"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-lg": ["Manrope"],

                    },
                    "fontSize": {

                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "600" }]
                    }
                }
            }
        }

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .leaf-radius {
            border-bottom-left-radius: 2rem;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional, no shell navigation) -->
<header class="w-full sticky top-0 z-40 bg-surface-bright/90 backdrop-blur-md border-b border-surface-container transition-colors">
<div class="flex items-center px-margin-mobile md:px-margin-desktop h-16 w-full max-w-7xl mx-auto">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container active:scale-95 transition-all text-on-surface-variant group flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-bright">
<span class="material-symbols-outlined text-headline-sm transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1"></div>
<!-- Verified Brand Element -->
<div class="flex items-center gap-1 opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]">
<span class="font-headline-sm text-headline-sm text-primary tracking-tight font-bold">MedField</span>
<span class="material-symbols-outlined text-primary text-sm" data-icon="verified" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<div class="flex-1"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile py-lg pb-xl flex flex-col justify-center">
<div class="mb-lg animate-[slideUp_0.4s_ease-out_forwards]">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs font-extrabold tracking-tight">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join MedField to manage your prescriptions and deliveries with precision.</p>
</div>
<form class="flex flex-col gap-gutter w-full" id="registerForm">
<!-- Full Name -->
<div class="flex flex-col gap-xs animate-[slideUp_0.5s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="fullName">Full name</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Phone -->
<div class="flex flex-col gap-xs animate-[slideUp_0.6s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="phone">Phone number</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Email (Optional) -->
<div class="flex flex-col gap-xs animate-[slideUp_0.7s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<div class="flex justify-between items-baseline">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="email">Email</label>
<span class="font-label-sm text-label-sm text-outline-variant">Optional</span>
</div>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Delivery Pincode -->
<div class="flex flex-col gap-xs animate-[slideUp_0.8s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="pincode">Delivery Pincode</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="pin_drop">pin_drop</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="pincode" inputmode="numeric" name="pincode" pattern="[0-9]*" placeholder="e.g. 10001" required="" type="text"/>
</div>
<p class="font-body-sm text-body-sm text-outline-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-sm" data-icon="local_shipping">local_shipping</span>
                    To check delivery availability
                </p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-sm animate-[slideUp_0.9s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<div class="flex items-center h-6">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-bright transition-colors cursor-pointer bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-tight cursor-pointer select-none pt-0.5" for="terms">
                    I agree to MedField's <a class="text-primary font-bold hover:underline underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Submit Button Container (with signature organic radius styling) -->
<div class="mt-lg pt-sm animate-[slideUp_1s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-lg leaf-radius flex items-center justify-center gap-2 hover:bg-primary-fixed-variant transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background shadow-[0_4px_14px_rgba(0,76,37,0.2)]" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="text-center mt-md animate-[slideUp_1.1s_ease-out_forwards] opacity-0" style="animation-fill-mode: forwards;">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-primary font-bold hover:underline underline-offset-2" href="#">Log in</a>
</p>
</div>
</form>
</main>
<style>
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
<script>
        // Simple client-side validation enhancement
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback for processing
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm" data-icon="progress_activity">progress_activity</span> Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-90');
            
            // Simulate network request
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-sm" data-icon="check">check</span> Account Created';
                btn.classList.replace('bg-primary', 'bg-primary-container');
                btn.classList.replace('hover:bg-primary-fixed-variant', 'hover:bg-primary-container');
                
                // Reset after showing success (in a real app this would redirect)
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.remove('opacity-90');
                    btn.classList.replace('bg-primary-container', 'bg-primary');
                    btn.classList.replace('hover:bg-primary-container', 'hover:bg-primary-fixed-variant');
                }, 2000);
            }, 1500);
        });

        // Add subtle focus effects to input containers
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-outline-variant');
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-outline-variant');
            });
        });
    </script>
</body></html>
