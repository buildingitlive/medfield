<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-between font-body-md">
<!-- Main Content Canvas - Linear Flow, No Nav -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl custom-leaf-radius shadow-sm p-lg md:p-xl flex flex-col items-center border border-outline-variant">
<!-- Logo -->
<div class="w-32 h-32 mb-lg rounded-full overflow-hidden border-4 border-surface-container-low shadow-sm">
<img alt="MedField Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaMSHbDeAj0zFjRzz6vbAs40Gm8SJFuKit6dbhfBASwFWpWg8GBPi9KladwNZA9UnY3AyrMS5X56JN5bLkeED0UORATMjLZXS-1CtTmLjW6K7Vtl3ayF3qz-QXZDF2pFM7qW7XMHgFC3aqBOF1jUXMmj9_98zRjOGfUMJ5X7-sTVItY4F48JUF6hElBrC6BvHoFx_CIuqI0YRbqxrKxgudUZUhLkPKUPAMVQvoe658SoDuaSY6DUc0-fHyqePxPEjnqQ"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-sm text-center">Welcome to MedField</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl text-center">Enter your mobile number to get started</p>
<!-- Input Form -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="phone">Mobile Number</label>
<div class="relative flex items-center w-full">
<span class="absolute left-4 font-body-lg text-body-lg text-on-surface-variant select-none">+1</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-[60px] pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-95 transition-all shadow-sm" type="button">
                    Send OTP
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-lg max-w-xs">
                By proceeding, you agree to our <a class="text-primary hover:underline font-semibold" href="#">Terms &amp; Conditions</a> and <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Trust Strip (Footer area for linear flow) -->
<footer class="w-full bg-surface-container py-lg px-margin-mobile border-t border-outline-variant">
<div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-md sm:gap-xl">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Genuine Medicines</span>
</div>
<div class="hidden sm:block w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Same-Day Delivery</span>
</div>
<div class="hidden sm:block w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Pay on Delivery</span>
</div>
</div>
</footer>
