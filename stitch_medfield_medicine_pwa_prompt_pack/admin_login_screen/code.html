<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(172, 244, 164, 0.5); /* primary-fixed semi-transparent */
            border-color: #00450d; /* primary */

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Subtle Gradient Background -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface-container-high via-surface-container to-surface-container-lowest opacity-80 pointer-events-none"></div>
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed/20 blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-secondary-fixed/10 blur-[120px] pointer-events-none"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[420px] px-md">
<div class="glass-panel rounded-xl shadow-[0_8px_32px_rgba(15,23,42,0.08)] p-xl flex flex-col items-center">
<!-- Logo & Brand -->
<div class="mb-lg flex flex-col items-center text-center">
<div class="w-[80px] h-[80px] rounded-lg overflow-hidden bg-surface-container-lowest shadow-sm mb-md flex items-center justify-center border border-outline-variant/30">
<img alt="MedField Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8jblZXvZO0m_ZNMNlemakxE9rlDTdbg2JNhJ92UUbWCafMGeZJ7jT_TjW_TTQuZQ6ldCirhhJ3IBLqIcvRJOlPQ045YABeLtrEt9C__Qsi2FzqIbRMQRzwqTax8NOddSS9Ro2o7DusGofmWVC9XN_uVSpGzwJ1EQAZieDxXW_nxFii0iJFdAhKLTVlCRw-VmQjp7pSbWk_ajioeAAxp9gvQ_QZ54Rs4sxBoLgkcXIsHorxHkAO72VzWfCCPcPGByM7g"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Admin Portal</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Secure access for administrative operations.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-md" method="POST" onsubmit="event.preventDefault(); document.getElementById('loginBtnText').classList.add('hidden'); document.getElementById('loginSpinner').classList.remove('hidden'); setTimeout(() =&gt; { window.location.reload(); }, 1500);">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative flex items-center group input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined text-outline ml-sm text-[20px] pointer-events-none group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-transparent border-none py-sm px-sm text-on-surface font-body-md focus:ring-0 placeholder:text-outline-variant placeholder:font-body-sm" id="email" name="email" placeholder="admin@medfield.internal" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative flex items-center group input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined text-outline ml-sm text-[20px] pointer-events-none group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-transparent border-none py-sm px-sm text-on-surface font-body-md focus:ring-0 placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-primary text-on-primary font-headline-sm text-body-md h-[44px] rounded-lg shadow-sm hover:bg-primary-container hover:shadow-md hover:-translate-y-[1px] active:translate-y-[0px] active:shadow-sm transition-all duration-150 flex items-center justify-center gap-sm" type="submit">
<span id="loginBtnText">Sign In</span>
<span class="hidden material-symbols-outlined animate-spin text-[20px]" id="loginSpinner">progress_activity</span>
</button>
</form>
<!-- Footer Note -->
<div class="mt-lg pt-md border-t border-outline-variant/30 w-full text-center">
<p class="font-label-md text-label-md text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[14px]">shield</span>
                    Authorized personnel only
                </p>
</div>
</div>
</main>
