<style>
        @keyframes subtle-fade-up {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-up {
            animation: subtle-fade-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .animate-fade-up-delay {
            opacity: 0;
            animation: subtle-fade-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
        }

        /* Enforce custom bottom-left radius motif globally if needed, though splash is minimal */
        .rounded-brand {
            border-radius: 0.5rem 0.5rem 0.5rem 3rem;
        }
    </style>

                MedField
            </h1>
<p class="font-body-lg text-body-lg text-on-secondary-container max-w-[240px]">

            </p>
</div>

<div class="absolute inset-0 pointer-events-none opacity-30 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary-fixed/20 via-surface-container-lowest to-surface-container-lowest"></div>

      Note: Shared Components (TopAppBar, BottomNavBar, NavigationDrawer) 
      are intentionally suppressed here as this is a Splash/Transactional
